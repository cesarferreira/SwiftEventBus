name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  spm:
    name: Swift Package Manager
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test -v

  xcode:
    name: Xcode framework
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build SwiftEventBus framework
        run: |
          xcodebuild \
            -project SwiftEventBus.xcodeproj \
            -scheme SwiftEventBus \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            build

  sample-app:
    name: Sample iOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build, launch, and smoke-test Sample on Simulator
        run: |
          set -euo pipefail

          DERIVED_DATA="$RUNNER_TEMP/DerivedData"
          LOG_FILE="$RUNNER_TEMP/sample-smoke.log"

          xcodebuild \
            -project SwiftEventBus.xcodeproj \
            -scheme Sample \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=- \
            build

          APP_PATH=$(find "$DERIVED_DATA" -path '*-iphonesimulator/Sample.app' -type d | head -1)
          test -d "$APP_PATH"

          SIM_ID=$(ruby -rjson -e '
          data = JSON.parse(`xcrun simctl list devices available -j`)
          data.fetch("devices").each do |runtime, devices|
            next unless runtime.include?("iOS")
            devices.each do |device|
              next unless device["isAvailable"]
              next unless device["name"].start_with?("iPhone")
              puts device["udid"]
              exit 0
            end
          end
          exit 1
          ' || true)

          if [ -z "${SIM_ID:-}" ]; then
            RUNTIME=$(ruby -rjson -e '
          runtimes = JSON.parse(`xcrun simctl list runtimes -j`).fetch("runtimes")
          ios = runtimes.select { |r| r["identifier"].include?("iOS") && r["isAvailable"] }
          latest = ios.max_by { |r| Gem::Version.new(r["version"]) }
          abort "No iOS simulator runtime available" unless latest
          puts latest["identifier"]
          ')
            SIM_ID=$(xcrun simctl create "SwiftEventBus-CI" "iPhone 16" "$RUNTIME")
          fi

          echo "Using simulator: $SIM_ID"

          xcrun simctl boot "$SIM_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM_ID" -b
          xcrun simctl install "$SIM_ID" "$APP_PATH"

          xcrun simctl launch "$SIM_ID" cesarferreira.Sample -SmokeTest >/dev/null
          sleep 12

          xcrun simctl spawn "$SIM_ID" log show --style compact --last 2m 2>/dev/null | tee "$LOG_FILE"

          grep -q "SwiftEventBusSmoke: Starting request" "$LOG_FILE"
          grep -q "SwiftEventBusSmoke: Request finished" "$LOG_FILE"

          xcrun simctl shutdown "$SIM_ID" || true
