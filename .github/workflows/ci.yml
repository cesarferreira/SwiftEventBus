name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  spm:
    name: Swift Package Manager
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test -v

  xcode:
    name: Xcode framework
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build SwiftEventBus framework
        run: |
          xcodebuild \
            -project SwiftEventBus.xcodeproj \
            -scheme SwiftEventBus \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            build

  sample-app:
    name: Sample iOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build, launch, and smoke-test Sample on Simulator
        run: |
          set -euo pipefail

          DERIVED_DATA="$RUNNER_TEMP/DerivedData"
          LOG_FILE="$RUNNER_TEMP/sample-smoke.log"

          DESTINATIONS=$(xcodebuild \
            -project SwiftEventBus.xcodeproj \
            -scheme Sample \
            -showdestinations 2>/dev/null || true)

          echo "$DESTINATIONS" | head -20

          SIM_ID=$(echo "$DESTINATIONS" | ruby - <<'RUBY'
          lines = STDIN.each_line.map(&:strip)
          preferred = lines.find { |l| l.include?("platform:iOS Simulator") && l.include?("name:iPhone 16") && !l.include?("placeholder") }
          preferred ||= lines.find { |l| l.include?("platform:iOS Simulator") && l.include?("name:iPhone") && !l.include?("placeholder") }
          preferred ||= lines.find { |l| l.include?("platform:iOS Simulator") && !l.include?("placeholder") }
          if preferred&.match(/id:([A-F0-9-]+)/)
            puts $1
          else
            warn "No simulator destination found"
            exit 1
          end
          RUBY
          )

          DESTINATION="platform=iOS Simulator,id=${SIM_ID}"
          echo "Using simulator destination: $DESTINATION"

          xcodebuild \
            -project SwiftEventBus.xcodeproj \
            -scheme Sample \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=- \
            build

          APP_PATH=$(find "$DERIVED_DATA" -path '*-iphonesimulator/Sample.app' -type d | head -1)
          test -d "$APP_PATH"

          xcrun simctl boot "$SIM_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM_ID" -b
          xcrun simctl install "$SIM_ID" "$APP_PATH"

          xcrun simctl launch "$SIM_ID" cesarferreira.Sample -SmokeTest >/dev/null
          sleep 12

          xcrun simctl spawn "$SIM_ID" log show --style compact --last 2m 2>/dev/null | tee "$LOG_FILE"

          grep -q "Starting request" "$LOG_FILE"
          grep -q "Request finished" "$LOG_FILE"

          xcrun simctl shutdown "$SIM_ID" || true
