name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  spm:
    name: Swift Package Manager
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test -v

  xcode:
    name: Xcode framework
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build SwiftEventBus framework
        run: |
          xcodebuild \
            -project SwiftEventBus.xcodeproj \
            -scheme SwiftEventBus \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            build
